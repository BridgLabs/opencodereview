name: Release

# Pushing a tag `v<version>` publishes the server, runner and web images for amd64 and arm64 to
# ghcr.io, so users can run docker-compose.images.yml without building. Prepare the tag with
# `pnpm changelog:release <version>` (docs/development.md#releases). The server and runner share an
# executor fingerprint, so both come from the same commit and carry the same tag.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/bpinheiroms

jobs:
  images:
    name: Images (${{ matrix.arch }})
    if: github.repository == 'bpinheiroms/opencodereview'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/opencodereview-server:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      # The runner image starts from the server image of the same build, as in docker-compose.yml.
      - name: Runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: OCR_RUNTIME_IMAGE=ocr_runtime
          build-contexts: ocr_runtime=docker-image://${{ env.REGISTRY }}/opencodereview-server@${{ steps.server.outputs.digest }}
          tags: ${{ env.REGISTRY }}/opencodereview-runner:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.arch }}

      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/opencodereview-web:${{ github.ref_name }}-${{ matrix.arch }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

  publish:
    name: Publish multi-arch tags and release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the architectures under the version and latest tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for image in server runner web; do
            name="$REGISTRY/opencodereview-$image"
            docker buildx imagetools create -t "$name:$version" -t "$name:latest" \
              "$name:$TAG-amd64" "$name:$TAG-arm64"
          done

      # The release notes are the version's section of CHANGELOG.md.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version. Run pnpm changelog:release $version before tagging."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
