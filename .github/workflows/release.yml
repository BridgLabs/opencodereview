name: Release

# A release is a button: Actions → Release → Run workflow. Everything merged since the last tag
# ships together as one version, so several pull requests make one release.
#   1. scripts/release-version.mjs picks the next version from the Conventional Commits since the
#      last tag (feat → minor, fix/perf → patch, breaking → major), or stops when there is nothing
#      to release. The bump input can raise it.
#   2. The changelog.d notes move into CHANGELOG.md and package.json takes the version, in a
#      `release: vX.Y.Z` commit pushed to a release/vX.Y.Z branch.
#   3. The server, runner and web images are built from that commit for amd64 and arm64.
#   4. Only once every image built, the commit moves main forward and is tagged vX.Y.Z, pushed with
#      the RELEASE_DEPLOY_KEY deploy key, which the ruleset lets bypass the pull request rule. The
#      images are published as X.Y.Z and latest, and the GitHub release takes the version's
#      CHANGELOG.md section. A failed build leaves main and the tags untouched.
# Turn dry-run on to see the next version and build the server and web images without publishing.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump; auto reads it from the commits
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Show the next version and build without publishing, tagging or committing
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: a second run waits instead of racing for the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/bridglabs
  DRY_RUN: ${{ inputs.dry-run }}

jobs:
  prepare:
    name: Version and tag
    if: github.repository == 'BridgLabs/opencodereview' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      # The deploy key pushes the release commit to a release/ branch here and to the protected main
      # in the publish job: the ruleset lets deploy keys bypass the pull request rule, and only this
      # workflow holds the key.
      - name: Checkout
        # GitHub's own checkout: the deploy key is not handed to a third-party action.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Next version
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          version=$(node scripts/release-version.mjs notes)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing to release: no feat, fix, perf or breaking commit since the last tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Next version: **v$version**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and tag the release
        id: tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/changelog.mjs release "$VERSION"
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.argv[1]; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n")' "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md changelog.d package.json
          git commit -m "release: v$VERSION"
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
            { echo "Dry run: nothing was pushed. Release notes:"; echo; awk -v h="## [$VERSION]" 'index($0,h)==1{f=1;next} f&&/^## \[/{exit} f&&/^\[[^]]+\]: /{exit} f' CHANGELOG.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            # main and the tag move only after the images build, in the publish job.
            git push --force origin "HEAD:refs/heads/release/v$VERSION"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Images (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.version != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@e4c1c000c95f9cc255f72940e9c56bcbd1239436 # v1.13.0

      - name: Log in to GitHub Container Registry
        if: env.DRY_RUN != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server image
        id: server
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.REGISTRY }}/opencodereview-server:${{ env.TAG }}-${{ matrix.arch }}

      # The runner image starts from the published server image of the same build, as in
      # docker-compose.yml; the server and runner share an executor fingerprint. A dry run has no
      # published server image, so it skips the runner.
      - name: Runner image
        if: env.DRY_RUN != 'true'
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: docker/Dockerfile.runner
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: OCR_RUNTIME_IMAGE=ocr_runtime
          build-contexts: ocr_runtime=docker-image://${{ env.REGISTRY }}/opencodereview-server@${{ steps.server.outputs.digest }}
          tags: ${{ env.REGISTRY }}/opencodereview-runner:${{ env.TAG }}-${{ matrix.arch }}

      - name: Web image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.REGISTRY }}/opencodereview-web:${{ env.TAG }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch tags and release
    needs: [prepare, images]
    if: needs.prepare.outputs.version != '' && !inputs.dry-run
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      TAG: v${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        # GitHub's own checkout: the deploy key is not handed to a third-party action.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Fast-forward only: if main moved during the build, the push fails and nothing is released.
      # main and the tag move together (--atomic). A re-run finds the tag already pushed, checks
      # that main holds the release commit, and goes on to publish.
      - name: Move main forward and tag the release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG is already tagged."
            git fetch -q origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$TAG exists but main does not contain it. Fix main or delete the tag, then run the release again."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "OpenCodeReview $TAG"
            git push --atomic origin "HEAD:refs/heads/main" "$TAG"
          fi
          git push origin --delete "release/$TAG" || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the architectures under the version and latest tags
        run: |
          for image in server runner web; do
            name="$REGISTRY/opencodereview-$image"
            docker buildx imagetools create -t "$name:$VERSION" -t "$name:latest" \
              "$name:$TAG-amd64" "$name:$TAG-arm64"
          done

      # The release notes are the version's section of CHANGELOG.md.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag --latest
          fi

      # GHCR creates packages private, even for a public repository; users must pull without a login.
      - name: Check anonymous pulls
        if: ${{ !github.event.repository.private }}
        run: |
          anonymous=$(mktemp -d)
          for image in server runner web; do
            if ! docker --config "$anonymous" manifest inspect "$REGISTRY/opencodereview-$image:$VERSION" >/dev/null; then
              echo "::error::$REGISTRY/opencodereview-$image is private. In its package settings, change the visibility to Public, then run this job again."
              exit 1
            fi
          done
