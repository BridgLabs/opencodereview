name: Site

# Publishes site/ as Cloudflare Workers static assets (the opencodereview-site Worker, served at
# opencodereview.run; see site/wrangler.jsonc) whenever main changes the landing page or the docs that
# site/llms-full.txt is built from. Needs the
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths: ["site/**", "README.md", "docs/**", "scripts/site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: site
      url: https://opencodereview.run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build llms-full.txt and the sitemap date
        run: node scripts/site/build.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 deploy --config site/wrangler.jsonc
