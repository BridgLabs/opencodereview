name: Docker smoke

# Called by ci.yml. A separate file, so ci.yml edits do not rebuild the images: the changes job runs
# this only when the images, the sandbox or this file change.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose file
        run: docker compose config --quiet

      # The smoke checks the sandbox, not speed: unoptimized Rust on every core compiles in a
      # fraction of the release build's time. The Release workflow builds with the defaults.
      - name: Build images
        run: |
          docker compose build \
            --build-arg CARGO_BUILD_JOBS="$(nproc)" \
            --build-arg CARGO_PROFILE_RELEASE_OPT_LEVEL=0

      # Fake inference: no credentials and no paid calls.
      - name: Runner sandbox smoke
        run: python3 -u docker/runner-smoke.py
