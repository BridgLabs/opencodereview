name: Changelog

# Each pull request writes its release notes in its own changelog.d file (changelog.d/README.md).
# The label events run the check again, because ci.yml does not run when a label changes.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notes:
    name: Release notes
    # Dependabot and draft pull requests skip this check, as they skip CI.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false

      # A change to CHANGELOG.md itself also passes: a release, or notes written by hand.
      - name: Require release notes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! git diff --name-only --diff-filter=ACMR HEAD^1 HEAD |
            grep -vFx changelog.d/README.md |
            grep -E '^(changelog\.d/.+\.md|CHANGELOG\.md)$' >/dev/null; then
            echo "::error::Write the release notes in changelog.d/${BRANCH//\//-}.md (see changelog.d/README.md), or add the no-changelog label when users see no change."
            exit 1
          fi

      - name: Check release note files
        run: node scripts/changelog.mjs check
