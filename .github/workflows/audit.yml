name: Dependency audit

# New advisories appear for dependencies that did not change, so CI's audit, which runs only when
# a lockfile changes, cannot see them. This run checks main and the published images every day;
# GitHub emails the maintainers when it fails.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: npm dependencies
        run: pnpm audit --audit-level high

  # The published images carry OS packages and CLIs that no lockfile lists. A high or critical
  # vulnerability with a fix available fails the run: the next release rebuilds the images, and
  # their Dockerfiles take the distribution's security updates at build time.
  images:
    name: Scan published images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Trivy
        run: |
          status=0
          for image in server runner web; do
            echo "::group::opencodereview-$image"
            docker run --rm aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "ghcr.io/bridglabs/opencodereview-$image:latest" || status=1
            echo "::endgroup::"
          done
          exit "$status"
