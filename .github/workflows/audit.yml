name: Dependency audit

# New advisories appear for dependencies that did not change, so CI's audit, which runs only when
# a lockfile changes, cannot see them. This run checks main and the published images every day;
# GitHub emails the maintainers when it fails.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies on main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: npm dependencies
        run: pnpm audit --audit-level high

  # The published images carry OS packages and CLIs that no lockfile lists. A high or critical
  # vulnerability with a fix available fails the run: the next release rebuilds the images, and
  # their Dockerfiles take the distribution's security updates at build time.
  images:
    name: Scan published images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Both architectures are scanned: each is built on its own runner and takes its own security
      # updates. The vulnerability database is downloaded once and shared. A finding exits 2, so a
      # scanner or pull error is reported apart from an image that needs a release.
      - name: Trivy
        run: |
          trivy() {
            docker run --rm -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c "$@"
          }
          trivy image --download-db-only --quiet
          status=0
          for image in server runner web; do
            for platform in linux/amd64 linux/arm64; do
              ref="ghcr.io/bridglabs/opencodereview-$image:latest"
              echo "::group::$ref ($platform)"
              code=0
              trivy image --quiet --skip-db-update --platform "$platform" --severity HIGH,CRITICAL \
                --ignore-unfixed --exit-code 2 "$ref" || code=$?
              echo "::endgroup::"
              case "$code" in
                0) ;;
                2) echo "::error::$ref ($platform) has fixable high or critical vulnerabilities; run a release to rebuild it."; status=1 ;;
                *) echo "::error::Trivy could not scan $ref ($platform) (exit $code)."; status=1 ;;
              esac
            done
          done
          exit "$status"
