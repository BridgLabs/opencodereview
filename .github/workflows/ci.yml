name: CI

# Only pull requests are checked. The main ruleset requires branches up to date with main before
# they merge, so what lands on main is exactly what was checked; a second run on main would repeat
# it. Draft pull requests wait until they are marked ready for review.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA, with the release in a comment: a tag can be
# moved to different code, a commit cannot. Dependabot updates both.
jobs:
  changes:
    name: Detect changed areas
    # Dependabot and draft pull requests skip CI to save Actions minutes.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" > changed-files.txt

          frontend=false
          backend=false
          docker=false
          dependencies=false
          while IFS= read -r file; do
            case "$file" in
              src/*|assets/*|index.html|package.json|pnpm-lock.yaml|knip.json|biome.json|tsconfig*.json|vite.config.*|.github/workflows/ci.yml)
                frontend=true
                ;;
            esac
            case "$file" in
              backend/*|Cargo.toml|Cargo.lock|deny.toml|.github/workflows/ci.yml|docker/*)
                backend=true
                ;;
            esac
            # The image build and sandbox smoke cost several minutes, so they run only when the
            # images or the sandbox change. Other code is covered by the frontend and backend jobs,
            # and the Release workflow builds the images again before publishing.
            case "$file" in
              docker/*|docker-compose.yml|.dockerignore|backend/src/sandbox/*|Cargo.lock|.github/workflows/ci.yml)
                docker=true
                ;;
            esac
            case "$file" in
              Cargo.toml|Cargo.lock|backend/Cargo.toml|deny.toml|package.json|pnpm-lock.yaml|.github/workflows/ci.yml)
                dependencies=true
                ;;
            esac
          done < changed-files.txt

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "docker=$docker"
            echo "dependencies=$dependencies"
          } >> "$GITHUB_OUTPUT"
          echo "Frontend: $frontend, backend: $backend, Docker: $docker, dependencies: $dependencies"

  file-size:
    name: Source file-size guard
    # Dependabot and draft pull requests skip CI to save Actions minutes.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check tracked source file sizes
        run: node scripts/check-file-sizes.mjs

  docs:
    name: Documentation links
    # Dependabot and draft pull requests skip CI to save Actions minutes.
    if: github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Offline: only links between files of this repository and their heading anchors. External
      # sites fail for reasons a pull request cannot fix.
      - name: Check Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.*', 'src/**/*') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vite-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Web proxy behavior regression
        run: python3 -B docker/test-web-proxy.py

  backend:
    name: Backend lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    container:
      image: rust:1.98.1-bookworm@sha256:9a73a5088750b4c95158ab26629c854c3d6fc4b173cb7bc8079ad252d8ed7bfa
      # Both CPUs of the private-repository hosted runner (Docker refuses more than the host has),
      # leaving memory for the Postgres service.
      options: --cpus 2 --memory 6g --memory-swap 6g --pids-limit 1024
    # Database tests clone a migrated template database per test on this server.
    services:
      postgres:
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      OCR_TEST_DATABASE_URL: postgres://ocr_test:ci-only@postgres:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tests run as a role that may create databases but is not a superuser, so a migration that
      # quietly needs superuser fails here rather than in a deployment.
      - name: Create the test database role
        env:
          PGPASSWORD: ci-only
        run: |
          apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ocr_test LOGIN CREATEDB PASSWORD 'ci-only'"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          prefix-key: v3-rust-ci-bookworm

      # The rust image ships the minimal profile, without rustfmt or clippy.
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all --check

      # Type-checks every target, so a separate `cargo check` would only repeat it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Diagnostic regression tests
        run: python3 -B docker/test_diagnostics.py

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advisories, licenses, banned crates and sources, configured in deny.toml.
      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: npm dependencies
        run: pnpm audit --audit-level high

  docker:
    name: Docker images and sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      # Fake inference: no credentials and no paid calls.
      - name: Runner sandbox smoke
        run: python3 -u docker/runner-smoke.py

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, file-size, docs, frontend, backend, dependencies, docker]
    if: always() && github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job finished with: $result"; exit 1 ;;
            esac
          done
