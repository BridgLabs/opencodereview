name: CI

# Only pull requests are checked. The main ruleset requires branches up to date with main before
# they merge, so what lands on main is exactly what was checked; a second run on main would repeat
# it. The jobs run on paid runners, so they start only when a maintainer adds the `ci` label: opening
# a pull request or pushing to it runs nothing but the `check` gate. To check a later push,
# remove the label and add it again. Only people with triage access can add labels.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.1"

# A push cancels the run on the commit it replaces, the `ci` label's included. Other labels get their
# own group, so adding one does not cancel a run the `ci` label started.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action != 'labeled' || github.event.label.name == 'ci' }}
  cancel-in-progress: true

# Third-party actions are pinned to a full commit SHA, with the release in a comment: a tag can be
# moved to different code, a commit cannot. Dependabot updates both.
jobs:
  changes:
    name: Detect changed areas
    if: github.event.label.name == 'ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter paths
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE" "$HEAD" > changed-files.txt

          frontend=false
          backend=false
          docker=false
          dependencies=false
          while IFS= read -r file; do
            case "$file" in
              src/*|assets/*|site/*|scripts/*|index.html|package.json|pnpm-lock.yaml|knip.json|biome.json|tsconfig*.json|vite.config.*|.github/workflows/ci.yml)
                frontend=true
                ;;
            esac
            case "$file" in
              backend/*|Cargo.toml|Cargo.lock|deny.toml|.github/workflows/ci.yml|docker/*)
                backend=true
                ;;
            esac
            # The image build and sandbox smoke cost several minutes, so they run only when the
            # images or the sandbox change. Other code is covered by the frontend and backend jobs,
            # and the Release workflow builds the images again before publishing.
            case "$file" in
              docker/*|docker-compose.yml|.dockerignore|backend/src/sandbox/*|Cargo.lock|.github/workflows/docker-smoke.yml)
                docker=true
                ;;
            esac
            case "$file" in
              Cargo.toml|Cargo.lock|backend/Cargo.toml|deny.toml|package.json|pnpm-lock.yaml|.github/workflows/ci.yml)
                dependencies=true
                ;;
            esac
          done < changed-files.txt

          {
            echo "frontend=$frontend"
            echo "backend=$backend"
            echo "docker=$docker"
            echo "dependencies=$dependencies"
          } >> "$GITHUB_OUTPUT"
          echo "Frontend: $frontend, backend: $backend, Docker: $docker, dependencies: $dependencies"

  file-size:
    name: Source file-size guard
    if: github.event.label.name == 'ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check tracked source file sizes
        run: node scripts/check-file-sizes.mjs

  docs:
    name: Documentation links
    if: github.event.label.name == 'ci'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false
      # Offline: only links between files of this repository and their heading anchors. External
      # sites fail for reasons a pull request cannot fix.
      - name: Check Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  frontend:
    name: Frontend typecheck and build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Vite
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.*', 'src/**/*') }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vite-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Unused files, exports and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Web proxy behavior regression
        run: python3 -B docker/test-web-proxy.py

  backend-lint:
    name: Backend lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false

      # Installed on the runner rather than run in a rust image, whose pull alone took a minute.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          prefix-key: v4-rust-ci

      - name: Format
        run: cargo fmt --all --check

      # Type-checks every target, so a separate `cargo check` would only repeat it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Diagnostic regression tests
        run: python3 -B docker/test_diagnostics.py

  backend-test:
    name: Backend test (${{ matrix.shard }}/8)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Each shard compiles the tests itself: building once and handing the binaries over through an
    # artifact costs about as long as the compile, because the shards then wait for it. Tests run in
    # one process per shard, not one per test: nextest's process per test doubled the suite's time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Database tests clone a migrated template database per test on this server.
    services:
      postgres:
        image: postgres:17@sha256:ae69c452f483507a6b99fb654cf93aad7fe156ffd2c56247707eef4e36d3c12b
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      CARGO_INCREMENTAL: "0"
      # Backtraces keep their file and line; full debug info only slows the compile and link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      OCR_TEST_DATABASE_URL: postgres://ocr_test:ci-only@localhost:5432/postgres
      SHARD: ${{ matrix.shard }}
      SHARDS: 8
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false

      # Tests run as a role that may create databases but is not a superuser, so a migration that
      # quietly needs superuser fails here rather than in a deployment. A throwaway server needs no
      # durability, and the runner's disk makes every flush slow.
      - name: Create the test database role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ocr_test LOGIN CREATEDB PASSWORD 'ci-only'" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      # The shards build the same tests, so one of them saves the cache for all.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
          cache-on-failure: true
          prefix-key: v4-rust-ci
          save-if: ${{ matrix.shard == 1 }}

      # The binaries and doc tests hold no tests today; the first shard runs them anyway.
      - name: Test
        run: |
          tests=()
          # Every library test, dealt round-robin: shard k of n takes the k-th name of every n.
          while IFS= read -r name; do tests+=("$name"); done < <(
            cargo test --lib --locked -q -- --list --format terse | sed -n 's/: test$//p' |
              awk -v n="$SHARDS" -v k="$SHARD" 'NR % n == k % n')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::Shard $SHARD/$SHARDS has no tests"
            exit 1
          fi
          echo "Shard $SHARD/$SHARDS: ${#tests[@]} tests"
          cargo test --lib --locked -- --exact "${tests[@]}"
          if [ "$SHARD" -eq 1 ]; then
            cargo test --workspace --bins --locked
            cargo test --workspace --doc --locked
          fi

  dependencies:
    name: Dependency audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          persist-credentials: false

      # Advisories, licenses, banned crates and sources, configured in deny.toml.
      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.15.0
          run_install: false

      - name: npm dependencies
        run: pnpm audit --audit-level high

  # In its own file, so editing this workflow does not rebuild the images.
  docker:
    name: Docker images and sandbox smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-smoke.yml

  # The required check. It runs on every event, on the smallest runner, so a pull request never
  # merges on a skipped `check`: GitHub counts a skipped required check as passed.
  check:
    name: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    needs: [changes, file-size, docs, frontend, backend-lint, backend-test, dependencies, docker]
    if: always()
    permissions:
      checks: read
    steps:
      - name: Require every job to succeed or be skipped
        if: github.event.label.name == 'ci'
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required job finished with: $result"; exit 1 ;;
            esac
          done

      # A push or another label runs no jobs. This commit passes only if the `ci` label already
      # checked it, which keeps a later label from turning a failed or missing run into a pass.
      - name: Require a passed run on this commit
        if: github.event.label.name != 'ci'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=check&per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not run on this commit. A maintainer starts it with the ci label."
            exit 1
          fi
          echo "A previous run passed on $SHA"
