version: 2

# `cooldown` waits a few days before proposing a new release: a compromised package is usually
# found and pulled within that time. Major versions change APIs, so they are updated by hand.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  # Keeps the SHA pins in the workflows current; the comment after each pin shows the release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
