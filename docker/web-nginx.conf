map $http_referer $ocr_referer_origin {
    ~^(https?://[^/]+)(?:/|$) $1;
    default "";
}

map $http_origin $ocr_upstream_origin {
    "" $ocr_referer_origin;
    default $http_origin;
}

server {
  listen 1421;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $ocr_upstream_origin;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The API token is written into the bundle at startup, so the same file name can hold a
  # different token after a reinstall; make browsers revalidate instead of reusing a stale copy.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
